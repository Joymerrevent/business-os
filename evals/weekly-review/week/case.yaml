schema_version: "1.1"
name: weekly-review-week
description: 日報の少ない週の週次レビューを書き、全事業の現況を更新する
context:
  scaffold_script: scaffold.sh
graders:
  - name: skill-started
    type: regex
    target: "trace"
    pattern: '"name":"Read","input":\{"file_path":"[^"]*templates/skill-conventions\.md"'
  - name: weekly-created
    type: file_exists
    path: "docs/operations/reviews/weekly-*.md"
  - name: week-id-in-name
    type: regex
    pattern: '"name":"(?:Write|Edit)","input":\{[^}]*"file_path":"[^"]*/docs/operations/reviews/weekly-\d{4}-W\d{2}\.md"'
    target: "trace"
  - name: state-a-updated
    type: regex
    pattern: "updated: 2026-09-28"
    target:
      source: "file"
      path: "docs/operations/state/biz-a.md"
    match: "not_contains"
  - name: state-b-updated
    type: regex
    pattern: "updated: 2026-09-28"
    target:
      source: "file"
      path: "docs/operations/state/biz-b.md"
    match: "not_contains"
  - name: hours-recorded
    type: regex
    pattern: '"name":"(?:Write|Edit)","input":\{[^}]*"file_path":"[^"]*/docs/operations/reviews/weekly-[^}]*10'
    target: "trace"
  - name: daily-record
    type: regex
    target: "trace"
    pattern: '"name":"(?:Write|Edit)","input":\{[^}]*"file_path":"[^"]*/docs/operations/daily/\d{4}-\d{2}-\d{2}\.md"[^}]*- (?:\d{2}|--):(?:\d{2}|--) /weekly-review — '
  - name: charter-not-written-by-write
    type: tool_used
    tool: "Write"
    min: 0
    max: 0
    input_match: '"file_path":"[^"]*/docs/charter/'
  - name: charter-not-edited
    type: tool_used
    tool: "Edit"
    min: 0
    max: 0
    input_match: '"file_path":"[^"]*/docs/charter/'
  - name: map-not-written-by-write
    type: tool_used
    tool: "Write"
    min: 0
    max: 0
    input_match: '"file_path":"[^"]*/CLAUDE\.md"'
  - name: map-not-edited
    type: tool_used
    tool: "Edit"
    min: 0
    max: 0
    input_match: '"file_path":"[^"]*/CLAUDE\.md"'
