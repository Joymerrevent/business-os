schema_version: "1.1"
name: morning-daily
description: 導入済みの company で /morning を実行し、5 項目の日報と実行記録を書く
context:
  scaffold_script: scaffold.sh
graders:
  - name: skill-started
    type: regex
    target: "trace"
    pattern: '"name":"Read","input":\{"file_path":"[^"]*templates/skill-conventions\.md"'
  - name: daily-created
    type: file_exists
    path: "docs/operations/daily/*.md"
  - name: daily-has-five-sections
    type: regex
    pattern: '"name":"(?:Write|Edit)","input":\{[^}]*"file_path":"[^"]*/docs/operations/daily/\d{4}-\d{2}-\d{2}\.md","content":"[^}]*## 全社サマリ[^}]*## 今日の優先事項[^}]*## 承認待ち[^}]*## 今日と直近の期限[^}]*## あなたへの問い'
    target: "trace"
  - name: approving-flagged
    type: regex
    pattern: '"name":"(?:Write|Edit)","input":\{[^}]*"file_path":"[^"]*/docs/operations/daily/[^}]*反映が途中'
    target: "trace"
  - name: no-placeholder-in-daily
    type: regex
    pattern: '"name":"(?:Write|Edit)","input":\{[^}]*"file_path":"[^"]*/docs/operations/daily/[^}]*\{\{'
    target: "trace"
    match: "not_contains"
  - name: daily-record
    type: regex
    target: "trace"
    pattern: '"name":"(?:Write|Edit)","input":\{[^}]*"file_path":"[^"]*/docs/operations/daily/\d{4}-\d{2}-\d{2}\.md"[^}]*- (?:\d{2}|--):(?:\d{2}|--) /morning — '
  - name: charter-not-written-by-write
    type: tool_used
    tool: "Write"
    min: 0
    max: 0
    input_match: '"file_path":"[^"]*/docs/charter/'
  - name: charter-not-edited
    type: tool_used
    tool: "Edit"
    min: 0
    max: 0
    input_match: '"file_path":"[^"]*/docs/charter/'
  - name: map-not-written-by-write
    type: tool_used
    tool: "Write"
    min: 0
    max: 0
    input_match: '"file_path":"[^"]*/CLAUDE\.md"'
  - name: map-not-edited
    type: tool_used
    tool: "Edit"
    min: 0
    max: 0
    input_match: '"file_path":"[^"]*/CLAUDE\.md"'
