schema_version: "1.1"
name: adr-supersede
description: 既存の記録を置き換える判断を accepted で起票し、古い記録を superseded にして相互に参照する
context:
  scaffold_script: scaffold.sh
graders:
  - name: skill-started
    type: regex
    target: "trace"
    pattern: '"name":"Read","input":\{"file_path":"[^"]*templates/skill-conventions\.md"'
  - name: new-supersedes-old
    type: regex
    pattern: '"name":"(?:Write|Edit)","input":\{[^}]*"file_path":"[^"]*/docs/decisions/(?!20260929-01)\d{8}-\d{2}-[a-z0-9-]+\.md"[^}]*supersedes: 20260929-01'
    target: "trace"
  - name: new-accepted
    type: regex
    pattern: '"input":\{[^}]*"file_path":"[^"]*/docs/decisions/(?!20260929-01)[^"]+"[^}]*status: accepted'
    target: "trace"
  - name: old-superseded
    type: regex
    pattern: "status: superseded"
    target:
      source: "file"
      path: "docs/decisions/20260929-01-sell-on-marketplace.md"
  - name: old-points-to-new
    type: regex
    pattern: '## 置き換え[\s\S]*\d{8}-\d{2}'
    target:
      source: "file"
      path: "docs/decisions/20260929-01-sell-on-marketplace.md"
  - name: daily-record
    type: regex
    target: "trace"
    pattern: '"name":"(?:Write|Edit)","input":\{[^}]*"file_path":"[^"]*/docs/operations/daily/\d{4}-\d{2}-\d{2}\.md"[^}]*- (?:\d{2}|--):(?:\d{2}|--) /adr — '
  - name: charter-not-written-by-write
    type: tool_used
    tool: "Write"
    min: 0
    max: 0
    input_match: '"file_path":"[^"]*/docs/charter/'
  - name: charter-not-edited
    type: tool_used
    tool: "Edit"
    min: 0
    max: 0
    input_match: '"file_path":"[^"]*/docs/charter/'
  - name: map-not-written-by-write
    type: tool_used
    tool: "Write"
    min: 0
    max: 0
    input_match: '"file_path":"[^"]*/CLAUDE\.md"'
  - name: map-not-edited
    type: tool_used
    tool: "Edit"
    min: 0
    max: 0
    input_match: '"file_path":"[^"]*/CLAUDE\.md"'
