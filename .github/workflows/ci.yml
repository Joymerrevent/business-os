name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

# 同じ ref で進行中の run は、新しい push で打ち切る
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # claude plugin validate 用。pnpm-workspace.yaml の熟成期間（7 日）にそろえ、公開から 7 日を過ぎた版に固定する
  CLAUDE_CODE_VERSION: "2.1.281"
  # gitleaks はリリースのバイナリを版固定で入れ、チェックサムを確かめる
  # （公式の gitleaks-action は組織アカウントでライセンスキーを求めるため使わない）
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256_LINUX_X64: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks が履歴を検査するため全履歴を取得する
          fetch-depth: 0

      # pnpm を先に入れる（setup-node の cache: pnpm が pnpm を要求するため）
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Claude Code（claude plugin validate 用）
        shell: bash
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      - name: Install gitleaks
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256_LINUX_X64}  ${RUNNER_TEMP}/${archive}" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/gitleaks"
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/gitleaks" gitleaks
          echo "${RUNNER_TEMP}/gitleaks" >> "${GITHUB_PATH}"

      # 検査は pnpm check が正典（package.json の check:* をパターンで束ねる）。一覧をここに写さない。
      # 成否は終了コードで見る。gitleaks は check:leak の中で実行される（Windows では入れないため warn）
      - name: Check
        run: pnpm check

      - name: Audit
        if: runner.os == 'Linux'
        run: pnpm audit --prod --audit-level high
