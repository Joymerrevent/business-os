name: Commitlint

# PR のコミットメッセージと PR のタイトルを Conventional Commits で検査する。
# ローカルの commit-msg フックは飛ばせるため、CI でも担保する。
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: commitlint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: commitlint
    runs-on: ubuntu-latest
    steps:
      # PR 範囲のコミットを検査するため全履歴を取得する
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint PR commits
        env:
          FROM_SHA: ${{ github.event.pull_request.base.sha }}
          TO_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "${FROM_SHA}" --to "${TO_SHA}" --verbose

      # squash マージでは PR のタイトルがコミットの subject になるため、タイトルも検査する。
      # タイトルは env 経由で渡し、run への直接展開（スクリプトインジェクション）を避ける
      - name: Lint PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "${PR_TITLE}" | pnpm exec commitlint --verbose
