name: 提案
description: 器（business-os）への改善の提案
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        **事業データ（会社名・事業名・人名・金額・顧客の情報）や認証情報は、絶対に貼らないでください。**
        器の Skill は 10 個で固定しています。Skill を増やす提案は、設計判断（ADR）として議論します。
  - type: textarea
    id: problem
    attributes:
      label: 困っていること
      description: どんな場面で、何が足りない・使いにくいか
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提案
      description: どう変わるとよいか
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考えたほかの方法（任意）
